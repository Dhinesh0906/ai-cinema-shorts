# AI Cinema Shorts configuration. Copy to config.yaml and edit.
ollama_url: http://127.0.0.1:11434

models:
  # LLMs run on Ollama Cloud (ollama.com) with a rotating free-key ring (see `cloud:` below).
  # Measured local alternative: gemma4:31b-it-qat (346 s/draft) beat qwen3.5:27b (1319 s/draft).
  writer: gemma4:31b                  # story / shot list / rewrites / edit director
  writer_think: false
  critic: gpt-oss:120b                # independent critic (different model family from the writer)
  critic_think: medium
  vlm: mlx-community/Qwen3-VL-32B-Instruct-4bit   # independent image/video/final validator
  image: AbstractFramework/flux.2-klein-4b-4bit
  video: AbstractFramework/wan2.2-ti2v-5b-diffusers-8bit
  whisper: mlx-community/whisper-large-v3-turbo
  clap: laion/clap-htsat-unfused
  kokoro_model: models/kokoro-v1.0.onnx
  kokoro_voices: models/voices-v1.0.bin
  sa3_dir: ~/Desktop/stable-audio-3/optimized/mlx

cloud:
  models: [gemma4:31b, gpt-oss:120b]   # these names are sent to ollama.com; anything else runs locally
  keys_file: secrets/ollama_api_keys.json
  cycle_pause_s: 30                    # all keys rate limited -> reset ring, pause, start over (forever)
  max_error_seconds: 1800              # network/5xx (not rate limits) give up after this -> job BLOCKED

# Image backend: local = FLUX.2 klein 4B on MLX (Apache-2.0, unlimited);
# cloudflare = FLUX.2 [dev] via Workers AI with a rotating account ring (secrets/cloudflare_accounts.json).
# Measured cost: ~2,800 neurons per 480x832 keyframe with 2 refs at 25 steps -> ~3-5 images/account/day.
image_backend: local
cloudflare:
  model: "@cf/black-forest-labs/flux-2-dev"
  keys_file: secrets/cloudflare_accounts.json
  steps: 25
  on_all_exhausted: wait     # wait = reset ring and keep cycling | local = finish with local klein 4B
  cycle_pause_s: 900

# Video backend: local = Wan2.2 TI2V-5B (MLX, free, ~7 min/shot);
# openrouter = alibaba/wan-2.6:free (720p, rotating keys in secrets/openrouter_keys.json). Measured
# 2026-10-10: the :free variant had ZERO endpoints (HTTP 404) and the paid one needs credits (402).
# Any unavailability falls back to local Wan 2.2 automatically for the rest of the job.
video_backend: local
openrouter:
  model: "alibaba/wan-2.6:free"
  keys_file: secrets/openrouter_keys.json
  resolution: 720p

default_preset: balanced

# Native generation settings (export is always 1080x1920 H.264/AAC; upscaling adds no native detail).
# Measured on this M5 Pro 48 GB (benchmarks/results.json):
#   480x832, 81 frames, 25 steps, --low-ram: ~440 s/shot, 23.6 GB peak footprint
#   480x832, 81 frames, 25 steps, no low-ram: ~390 s/shot, 37.2 GB peak (too close to 48 GB; not used)
#   704x1280, 81 frames, 25 steps, --low-ram: ~1288 s/shot, 44 GB peak, swapped (unsafe)
#   Same seed with/without low-ram is bit-identical.
# MLX-Gen docs: TI2V-5B canvases below 832x480 are routing checks, not visual-quality settings.
presets:
  draft:      {width: 480, height: 832, fps: 16, max_frames: 81, steps: 20, guidance: 5.0, flow_shift: 3.0, low_ram: true}
  balanced:   {width: 480, height: 832, fps: 16, max_frames: 81, steps: 25, guidance: 5.0, flow_shift: 3.0, low_ram: true}
  # 704x1280 (TI2V-5B's designed size) was measured and REJECTED for this 48 GB Mac: 1288 s/shot,
  # 44 GB peak footprint, MLX peak 54 GB, 9.8 GB swap. Not offered as a preset.

shot_min_seconds: 2.5
shot_max_seconds: 5.0          # 81 frames @ 16 fps = 5.06 s of native footage
narration_wps: 2.6
image_candidates: 2
burn_captions: true
generate_music: true
generate_sfx: true

retries:
  max_attempts: 3              # per asset
  story_rewrites: 3
  final_repairs: 2

thresholds:
  image_optional_ratio: 0.6
  video_optional_ratio: 0.5
  min_mean_flow: 0.15
  max_freeze_fraction: 0.35
  max_black_fraction: 0.2
  max_temporal_spike: 6.0
  max_feature_drift: 0.0       # 0 = disabled until calibrated by `cinema benchmark --stage validators`
  max_wer: 0.15
  max_peak_dbfs: -0.5
  min_mean_db: -35.0
  final_max_wer: 0.25
  target_lufs: -14.0

memory:
  min_free_gib_disk: 100
  launch_min_available_gib: 8
  recovery_timeout_s: 180
  worker_timeout_s: 10800
